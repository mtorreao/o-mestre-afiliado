# docker-compose.dev.yml — Stack completa de desenvolvimento/testing
# =============================================================================
# DIFERENÇA do dev.ts (bun run dev):
#   dev.ts       → apps rodam em hot-reload (bun --watch / vite dev server)
#   dev compose  → apps compilados (production build) nos containers
#
# VANTAGENS:
#   - Ambiente isolado e reproduzível (não depende do runtime do host)
#   - Testa os Dockerfiles e builds reais (mesmo pipeline da produção)
#   - Todas as dependências em um único comando
#   - Evolution API dentro da rede Docker (sem host.docker.internal)
#
# USO:
#   bun run dev
#
# Com override de portas do .env.infra (se 5453 estiver ocupada):
#   DEV_PORT_BASE=6000 bun run dev
#
# Com tunnel Cloudflare (requer ~/.cloudflared/omestre-afiliado.yml):
#   bun run dev  # cria/reutiliza o tunnel da branch automaticamente
#
# PORTAS (dev compose — faixa 545x para evitar conflito com docker-compose.infra.yml que usa 544x):
#   API        5452  (container:5442)
#   Web        5451  (container:5441)
#   PostgreSQL 5453  (container:5432)  ← override via POSTGRES_PORT
#   Evolution  5454  (container:8080)  ← override via EVOLUTION_API_PORT
#   Redis      5455  (container:6379)  ← override via REDIS_PORT
#
# BUILD:
#   Depois de alterar código, rebuildar com --build:
#     bun run dev
#
# LOGS:
#   docker compose -f docker-compose.dev.yml logs -f
#   docker compose -f docker-compose.dev.yml logs -f api
# =============================================================================

name: ${DEV_COMPOSE_PROJECT:-o-mestre-afiliado-dev}

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE  (PostgreSQL, Redis, Evolution API)
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      POSTGRES_DB: omestre_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
    volumes:
      - omestre_dev_postgres_data:/var/lib/postgresql/data
    ports:
      - '${DEV_POSTGRES_HOST_PORT:-127.0.0.1:5453:5432}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d omestre_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omestre-dev-net

  redis:
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes --timeout 0
    volumes:
      - omestre_dev_redis_data:/data
    ports:
      - '${DEV_REDIS_HOST_PORT:-127.0.0.1:5455:6379}'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omestre-dev-net

  evolution-api:
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_evolution
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${DEV_EVOLUTION_HOST_PORT:-127.0.0.1:5454:8080}'
    volumes:
      - omestre_dev_evolution_instances:/evolution/instances
    environment:
      # ── Database ──────────────────────────────────────────────────────
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: >-
        postgresql://evolution:${POSTGRES_PASSWORD:-evolution_pass}@postgres:5432/omestre_db?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ${DEV_DATABASE_CLIENT_NAME:-omestre_afiliado_dev}
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_LABELS: 'true'
      DATABASE_SAVE_DATA_HISTORIC: 'true'

      # ── Server ────────────────────────────────────────────────────────
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # ── Cache (Redis) ─────────────────────────────────────────────────
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_PREFIX_KEY: ${DEV_CACHE_PREFIX:-evolution_omestre_dev}

      # ── Auth ──────────────────────────────────────────────────────────
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-api-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      # ── Webhook Global ────────────────────────────────────────────────
      # Aponta para o container api na rede Docker (porta 5442)
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_URL: http://api:5442/webhook/message
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
      WEBHOOK_EVENTS_GROUPS_UPSERT: 'true'
      WEBHOOK_EVENTS_GROUPS_UPDATE: 'true'
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: 'true'

      # ── Logs ──────────────────────────────────────────────────────────
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS,WEBSOCKET
      LOG_BAILEYS: error

      # ── QR Code ───────────────────────────────────────────────────────
      QRCODE_LIMIT: 30
      QRCODE_COLOR: '#175197'

      # ── Misc ──────────────────────────────────────────────────────────
      DEL_INSTANCE: 'false'
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_CLIENT: 'O Mestre Afiliado (Dev)'
      CONFIG_SESSION_PHONE_NAME: Chrome
      CORS_ORIGIN: '*'
      CORS_CREDENTIALS: 'true'

      # ── Desabilitar integrações não utilizadas ────────────────────────
      TYPEBOT_ENABLED: 'false'
      CHATWOOT_ENABLED: 'false'
      OPENAI_ENABLED: 'false'
      DIFY_ENABLED: 'false'
      N8N_ENABLED: 'false'
      EVOAI_ENABLED: 'false'
      S3_ENABLED: 'false'
      RABBITMQ_ENABLED: 'false'
      KAFKA_ENABLED: 'false'
      SQS_ENABLED: 'false'
      PUSHER_ENABLED: 'false'
      WEBSOCKET_ENABLED: 'false'
    networks:
      - omestre-dev-net

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATIONS  (production builds via Dockerfile)
  # ═══════════════════════════════════════════════════════════════════════════

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${DEV_API_HOST_PORT:-127.0.0.1:5452:5442}'
    env_file:
      - ${DEV_APP_ENV_FILE:-.env}
    environment:
      # Sobrescreve .env para apontar para os containers Docker
      API_PORT: '5442'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
      POSTGRES_DATABASE: omestre_db
      POSTGRES_SCHEMA: omestre
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-api-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5451}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-http://localhost:5451/api/ml/callback}
      # Worker metrics API (DNS interno do container) — Ingestor v2
      WORKER_METRICS_URL: http://ingestor:9092
      # Dispatcher metrics (DNS interno do container)
      DISPATCHER_METRICS_URL: http://dispatcher:9093
      # Webhook que a Evolution API usa para chamar de volta
      WEBHOOK_URL: http://api:5442/webhook/message
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      METRICS_API_KEY: ${METRICS_API_KEY}
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r=await fetch('http://localhost:5442/health');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - omestre-dev-net

  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_ingestor
    restart: unless-stopped
    ports:
      - '${DEV_INGESTOR_HOST_PORT:-127.0.0.1:9092:9092}'
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${DEV_APP_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
      POSTGRES_DATABASE: omestre_db
      POSTGRES_SCHEMA: omestre
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-api-key}
      REDIS_URL: redis://redis:6379
      METRICS_API_KEY: ${METRICS_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BLACKLIST_PATH: /app/blacklist.json
      WHITELIST_PATH: /app/whitelist.json
      METRICS_PORT: '9092'
    volumes:
      - ./blacklist.json:/app/blacklist.json:ro
      - ./whitelist.json:/app/whitelist.json:ro
    networks:
      - omestre-dev-net

  dispatcher:
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_dispatcher
    restart: unless-stopped
    ports:
      - '${DEV_DISPATCHER_HOST_PORT:-127.0.0.1:9093:9093}'
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${DEV_APP_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
      POSTGRES_DATABASE: omestre_db
      POSTGRES_SCHEMA: omestre
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-api-key}
      REDIS_URL: redis://redis:6379
      METRICS_API_KEY: ${METRICS_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      METRICS_PORT: '9093'
    networks:
      - omestre-dev-net

  catalog-worker:
    build:
      context: .
      dockerfile: apps/catalog-worker/Dockerfile
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_catalog_worker
    restart: unless-stopped
    ports:
      - '${DEV_CATALOG_HOST_PORT:-127.0.0.1:5456:9094}'
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${DEV_APP_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_pass}
      POSTGRES_DATABASE: omestre_db
      POSTGRES_SCHEMA: omestre
      REDIS_URL: redis://redis:6379
      METRICS_API_KEY: ${METRICS_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      METRICS_PORT: '9094'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r=await fetch('http://localhost:9094/health');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - omestre-dev-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${DEV_WEB_HOST_PORT:-127.0.0.1:5451:5441}'
    environment:
      # Já tem default api:5442 no Dockerfile, mas explícito é mais seguro
      API_UPSTREAM: api:5442
    networks:
      - omestre-dev-net

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL: Cloudflare Tunnel
  # ═══════════════════════════════════════════════════════════════════════════
  # Ativado pelo scripts/dev.ts, que cria/reutiliza um tunnel por branch.
  # Use SKIP_TUNNEL=1 para subir somente a stack local.
  tunnel:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:2024.10.0
    container_name: ${DEV_CONTAINER_PREFIX:-omestre_dev}_tunnel
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - '${DEV_TUNNEL_CONFIG_HOST_PATH:-./deploy/cloudflared/config.yml}:/etc/cloudflared/config.yml:ro'
      - '${DEV_TUNNEL_CREDENTIALS_HOST_PATH:-${HOME}/.cloudflared/f1437a45-faee-4b13-ba05-04a87bbecbae.json}:/etc/cloudflared/${DEV_TUNNEL_ID:-f1437a45-faee-4b13-ba05-04a87bbecbae}.json:ro'
    networks:
      - omestre-dev-net

# ═════════════════════════════════════════════════════════════════════════════
# Networks
# ═════════════════════════════════════════════════════════════════════════════
networks:
  omestre-dev-net:
    name: ${DEV_NETWORK_NAME:-omestre-dev-net}
    driver: bridge

# ═════════════════════════════════════════════════════════════════════════════
# Volumes (persistent data, isolado da produção)
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  omestre_dev_postgres_data:
    name: ${DEV_POSTGRES_VOLUME_NAME:-omestre-dev-postgres-data}
  omestre_dev_redis_data:
    name: ${DEV_REDIS_VOLUME_NAME:-omestre-dev-redis-data}
  omestre_dev_evolution_instances:
    name: ${DEV_EVOLUTION_VOLUME_NAME:-omestre-dev-evolution-instances}
