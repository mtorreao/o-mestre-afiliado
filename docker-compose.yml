name: o-mestre-afiliado

# Producao - O Mestre Afiliado
# Hardening 2026-08-06 (branch wt/security-hardening-compose + P2):
#  P0: senha do Postgres sem fallback - falha alto se .env ausente
#  P0: credenciais do banco movidas para .env (nao inline em environment)
#  P1: apps Bun stateless rodam como UID 1000 (nao root)
#  P1: read_only + tmpfs nos stateless; filesystem imutavel
#  P1: no-new-privileges em todos os apps Bun
#  P1: Evolution LOG_LEVEL reduzido (sem DEBUG/VERBOSE em prod)
#  P1: Evolution DATABASE_SAVE_HISTORIC off (LGPD - minimizacao)
#  P1: Evolution CORS_ORIGIN restrito a ${FRONTEND_URL}
#  P2: resource limits (cpus/memory/pids) em apps + evolution
#  P2: imagens externas pinadas por SHA256 digest (immutable)
#  P2: cloudflared removido do compose (roda como systemd no host)
#  P2: ingestor com bind mount para blacklist/whitelist (./data/ingestor)

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: omestre_postgres
    restart: always
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-omestre_db}
      POSTGRES_USER: ${POSTGRES_USERNAME:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - omestre_prod_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5446}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-evolution} -d ${POSTGRES_DATABASE:-omestre_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omestre-prod-net
      - omestre-infra-net

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: omestre_redis
    restart: always
    command: redis-server --port 6379 --appendonly yes --timeout 0
    volumes:
      - omestre_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omestre-prod-net
      - omestre-infra-net

  evolution-api:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 300
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    container_name: omestre_evolution
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - omestre_prod_evolution_instances:/evolution/instances
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USERNAME:-evolution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-omestre_db}?schema=evolution_api"
      DATABASE_CONNECTION_CLIENT_NAME: omestre_afiliado_prod
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_PREFIX_KEY: ${CACHE_PREFIX:-evolution_omestre_prod}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:5442/webhook/message
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "true"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "true"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#175197"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_CLIENT: "O Mestre Afiliado (Prod)"
      CONFIG_SESSION_PHONE_NAME: Chrome
      CORS_ORIGIN: ${CORS_ORIGIN:-${FRONTEND_URL:-https://omestreafiliado.com.br}}
      CORS_CREDENTIALS: "false"
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"
      N8N_ENABLED: "false"
      EVOAI_ENABLED: "false"
      S3_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      KAFKA_ENABLED: "false"
      SQS_ENABLED: "false"
      PUSHER_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # API - Elysia REST API
  api:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 200
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
      args:
        NODE_ENV: production
    container_name: omestre_api
    restart: always
    ports:
      - "${API_PORT:-127.0.0.1:5442:5442}"
    env_file:
      - .env
    # P0: credenciais do banco vem do .env (env_file), NAO inline.
    environment:
      EVOLUTION_API_URL: "http://evolution-api:8080"
      WORKER_METRICS_URL: "http://ingestor:9092"
      DISPATCHER_METRICS_URL: "http://dispatcher:9093"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5441}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      METRICS_API_KEY: "${METRICS_API_KEY}"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:5442/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  web:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: omestre_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-127.0.0.1:5441:5441}"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # Ingestor (v2) - instala Chromium; roda como root mas com no-new-privileges
  ingestor:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 300
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: omestre_ingestor
    restart: always
    depends_on:
      api:
        condition: service_healthy
    # Bind mount: operador edita ./data/ingestor/*.json sem rebuild.
    # Arquivos sao opcionais (existem vazios como default). Quando vazios,
    # o pipeline nao filtra nada (ver apps/ingestor/src/terms-lists.ts).
    volumes:
      - ./data/ingestor:/app/data:ro
    env_file:
      - .env
    environment:
      EVOLUTION_API_URL: "http://evolution-api:8080"
      REDIS_URL: "redis://redis:6379"
      METRICS_API_KEY: "${METRICS_API_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      BLACKLIST_PATH: /app/data/blacklist.json
      WHITELIST_PATH: /app/data/whitelist.json
      METRICS_PORT: "9092"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:9092/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /root/.cache:size=128M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # Dispatcher (v2)
  dispatcher:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
          pids: 200
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
    container_name: omestre_dispatcher
    restart: always
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EVOLUTION_API_URL: "http://evolution-api:8080"
      REDIS_URL: "redis://redis:6379"
      METRICS_API_KEY: "${METRICS_API_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      METRICS_PORT: "9093"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:9093/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # CatalogWorker (Queue C - catalogo de precos)
  catalog-worker:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
          pids: 200
    build:
      context: .
      dockerfile: apps/catalog-worker/Dockerfile
    container_name: omestre_catalog_worker
    restart: always
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://redis:6379"
      METRICS_API_KEY: "${METRICS_API_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      METRICS_PORT: "9094"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:9094/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # Admin API (Hono + Bun.serve)
  admin-api:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 100
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    container_name: omestre_admin_api
    restart: always
    env_file:
      - .env
    environment:
      ADMIN_API_PORT: "9090"
      OMA_DEPLOY_SCRIPT: "${OMA_DEPLOY_SCRIPT:-/scripts/deploy-prod.sh}"
      OMA_DEPLOY_STATE_DIR: /var/lib/oma
      REDIS_URL: "redis://redis:6379"
      POSTGRES_URL: "postgresql://${POSTGRES_USERNAME:-evolution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-omestre_db}?schema=omestre"
      METRICS_API_KEY: "${METRICS_API_KEY}"
      WORKER_METRICS_URL: "http://ingestor:9092"
      DISPATCHER_METRICS_URL: "http://dispatcher:9093"
    volumes:
      - oma_admin_state:/var/lib/oma
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:9090/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net
      - omestre-infra-net

  # Admin Web (Vite SPA)
  admin-web:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 100
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: omestre_admin_web
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-127.0.0.1:9091:9091}"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32M
    security_opt:
      - no-new-privileges:true
    networks:
      - omestre-prod-net

networks:
  omestre-prod-net:
    name: omestre-prod-net
    driver: bridge
  omestre-infra-net:
    name: omestre-infra-net
    external: true

volumes:
  omestre_prod_postgres_data:
    name: omestre-prod-postgres-data
  omestre_prod_redis_data:
    name: omestre-prod-redis-data
  omestre_prod_evolution_instances:
    name: omestre-prod-evolution-instances
  oma_admin_state:
    name: omestre-prod-admin-state
