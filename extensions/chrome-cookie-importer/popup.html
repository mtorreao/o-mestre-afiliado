<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:420px; min-height:350px; background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; font-size:14px; }
.container { padding:14px; }
h1 { font-size:15px; background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { font-size:11px; color:#64748b; margin-bottom:10px; }
label { display:block; font-size:11px; color:#94a3b8; margin-bottom:3px; }
select,input,textarea { width:100%; padding:6px 8px; border-radius:6px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:13px; outline:none; margin-bottom:6px; }
textarea { font-family:monospace; font-size:12px; resize:vertical; min-height:60px; }
.row { display:flex; gap:4%; margin-bottom:0; }
.row > div { width:48%; }
button { width:100%; padding:9px; border-radius:8px; border:none; background:#6366f1; color:white; font-size:13px; font-weight:600; cursor:pointer; transition:background .2s; }
button:hover { background:#4f46e5; }
button:disabled { background:#6366f180; cursor:not-allowed; }
button.success { background:#059669; }
button.success:hover { background:#047857; }
button.danger { background:#dc2626; }
button.small { width:auto; padding:5px 10px; font-size:11px; }
.status { margin-top:8px; padding:8px 10px; border-radius:6px; font-size:12px; display:none; }
.status.success { display:block; background:#14532d; color:#86efac; }
.status.error { display:block; background:#7f1d1d; color:#fca5a5; }
.status.loading { display:block; background:#1e3a5f; color:#93c5fd; }
.session-state { margin:4px 0 8px; padding:6px 8px; border-radius:6px; font-size:11px; }
.session-state.neutral { background:#1e293b; color:#94a3b8; }
.session-state.valid { background:#14532d; color:#86efac; }
.session-state.expired { background:#7f1d1d; color:#fca5a5; }
a { color:#818cf8; }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <div style="flex:1">
      <h1>O Mestre Afiliado</h1>
      <div class="subtitle" id="greeting">Olá 👋</div>
    </div>
  </div>

  <div id="authState" class="session-state neutral">🔴 Não logado</div>

  <!-- Mercado Livre -->
  <button id="importBtn" disabled style="margin-top:10px">📥 Importar cookies Mercado Livre</button>
  <div class="status" id="sessionStatus"></div>

  <!-- Magalu (Magazine Você) — desativado temporariamente (2026-08-01) -->
</div>
<script src="lib/log-sink.config.js"></script>
<script src="lib/log.js"></script>
<script src="lib/log-sink-pure.js"></script>
<script src="lib/log-sink.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
