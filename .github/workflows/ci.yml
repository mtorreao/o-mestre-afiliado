name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 1.3.0 tem bug de hoisting de 'catalog:' + workspaces que instala
          # duas cópias de drizzle-orm (paths com e sem hash), quebrando o
          # typecheck (SQL<unknown> de pacotes distintos). 1.3.14 corrige.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Coverage (relatório agregado)
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/summary.md
            '*/coverage/lcov.info'
            'apps/*/coverage/lcov.info'
            'packages/*/coverage/lcov.info'
          if-no-files-found: ignore

      - name: Prettier check (apenas arquivos do diff)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD --diff-filter=ACMR | grep -E "\.(ts|tsx|js|jsx|json|css|md)$" || true)
          if [ -n "$FILES" ]; then
            bunx prettier --check $FILES
          else
            echo "Nenhum arquivo formatável no diff, pulando prettier."
          fi
