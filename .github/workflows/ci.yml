name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs obsoletos do mesmo ref (push novo substitui o anterior),
# economizando minutos de Actions em PRs com commits frequentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 1.3.0 tem bug de hoisting de 'catalog:' + workspaces que instala
          # duas cópias de drizzle-orm (paths com e sem hash), quebrando o
          # typecheck (SQL<unknown> de pacotes distintos). 1.3.14 corrige.
          bun-version: 1.3.14

      - name: Cache bun install (workspaces)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Coverage (relatório agregado)
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/summary.md
            '*/coverage/lcov.info'
            'apps/*/coverage/lcov.info'
            'packages/*/coverage/lcov.info'
          if-no-files-found: ignore

      - name: Prettier check (apenas arquivos do diff)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD --diff-filter=ACMR | grep -E "\.(ts|tsx|js|jsx|json|css|md)$" || true)
          if [ -n "$FILES" ]; then
            bunx prettier --check $FILES
          else
            echo "Nenhum arquivo formatável no diff, pulando prettier."
          fi

  e2e:
    name: e2e (docker compose + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun install (workspaces)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache browser do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Instalar browser do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Setup Buildx (buildkit p/ cache GHA das imagens)
        uses: docker/setup-buildx-action@v3

      - name: Rodar testes E2E (sobe stack própria, executa specs, derruba)
        run: bun run test:e2e

      - name: Upload report do Playwright (screenshots/traces de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
