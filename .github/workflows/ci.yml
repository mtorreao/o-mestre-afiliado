name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs obsoletos do mesmo ref (push novo substitui o anterior),
# economizando minutos de Actions em PRs com commits frequentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0: o diff docs-only precisa do histórico completo
          # (base.sha/event.before não existem em clone raso).
          fetch-depth: 0

      # PRs/pushes só de documentação (docs/, *.md, imagens...) fazem early-exit
      # verde aqui — sem bun install, build, testes nem e2e (~15s em vez de 45min).
      # Os checks obrigatórios ("typecheck + build", "e2e") continuam sendo
      # reportados como success, então o branch protection não trava o merge.
      #
      # Diff do PR: o checkout é o merge ref (refs/pull/N/merge), então
      # HEAD^1 = base (main) e HEAD^2 = head do PR. git diff HEAD^1...HEAD^2
      # devolve EXATAMENTE os arquivos do PR — mesmo se a main avançou depois
      # da abertura (base.sha do evento pode estar defasado).
      - name: Detectar mudança docs-only (skip CI)
        id: docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only HEAD^1...HEAD^2 2>/dev/null || git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}"...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD 2>/dev/null || true)
          fi
          RESULT=$(printf '%s\n' "$FILES" | bash scripts/ci/check-docs-only.sh)
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT (files: $(echo "$FILES" | tr '\n' ' '))"

      - name: Setup Bun
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          # 1.3.0 tem bug de hoisting de 'catalog:' + workspaces que instala
          # duas cópias de drizzle-orm (paths com e sem hash), quebrando o
          # typecheck (SQL<unknown> de pacotes distintos). 1.3.14 corrige.
          bun-version: 1.3.14

      - name: Cache bun install (workspaces)
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun run typecheck

      - name: Build
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun run build

      - name: Unit tests
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun run test:unit

      - name: Coverage (relatório agregado)
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/summary.md
            '*/coverage/lcov.info'
            'apps/*/coverage/lcov.info'
            'packages/*/coverage/lcov.info'
          if-no-files-found: ignore

      - name: Prettier check (apenas arquivos do diff)
        if: steps.docs-only.outputs.docs_only == 'false'
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD --diff-filter=ACMR | grep -E "\.(ts|tsx|js|jsx|json|css|md)$" || true)
          if [ -n "$FILES" ]; then
            bunx prettier --check $FILES
          else
            echo "Nenhum arquivo formatável no diff, pulando prettier."
          fi

  e2e:
    name: e2e (docker compose + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mesmo early-exit do job build — docs-only conclui verde em segundos.
      # (HEAD^1 = base, HEAD^2 = head do PR no checkout do merge ref.)
      - name: Detectar mudança docs-only (skip CI)
        id: docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only HEAD^1...HEAD^2 2>/dev/null || git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}"...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD 2>/dev/null || true)
          fi
          RESULT=$(printf '%s\n' "$FILES" | bash scripts/ci/check-docs-only.sh)
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT (files: $(echo "$FILES" | tr '\n' ' '))"

      - name: Setup Bun
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun install (workspaces)
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bun install --frozen-lockfile

      - name: Cache browser do Playwright
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Instalar browser do Playwright
        if: steps.docs-only.outputs.docs_only == 'false'
        run: bunx playwright install --with-deps chromium

      - name: Setup Buildx (buildkit p/ cache GHA das imagens)
        if: steps.docs-only.outputs.docs_only == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Rodar testes E2E (sobe stack própria, executa specs, derruba)
        if: steps.docs-only.outputs.docs_only == 'false'
        run: E2E_WORKERS=4 bun run test:e2e

      - name: Upload report do Playwright (screenshots/traces de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
