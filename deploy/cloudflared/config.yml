# deploy/cloudflared/config.yml — Cloudflare Tunnel ingress (ref)
# ==============================================================================
# Tunnel `omestre-afiliado`: expõe dev.omestreafiliado.com.br → Web (:5441).
#
# omestreafiliado.com.br reservado para produção.
# ==============================================================================

tunnel: f1437a45-faee-4b13-ba05-04a87bbecbae
# Caminho DENTRO do container (o docker-compose monta a credencial em /etc/cloudflared/).
# No host Windows use um config separado apontando para C:\Users\torre\.cloudflared\...
credentials-file: /etc/cloudflared/f1437a45-faee-4b13-ba05-04a87bbecbae.json

ingress:
  - hostname: dev.omestreafiliado.com.br
    service: http://web:5441
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      noHappyEyeballs: false
  - service: http_status:404
